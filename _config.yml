# ─── Site Configuration ────────────────────────────────────────
# Custom theme — layouts are in _layouts/, styles in assets/css/
# Theme gem kept in Gemfile for CI compatibility but local layouts take precedence

theme: jekyll-theme-chirpy

lang: en
timezone:

# ─── SEO / Meta ────────────────────────────────────────────────
title: Mike Martinez M.S.
tagline: Bioinformatics Research Scientist
description: >-
  Thoughts and musings about bioinformatics, practical tips and tricks, and everything in between.

url: "https://mikemartinez99.github.io"
baseurl: ""

# ─── Social ────────────────────────────────────────────────────
github:
  username: mikemartinez99

social:
  name: Mike Martinez M.S.
  email: michael.j.martinez@dartmouth.edu
  links:
    - https://github.com/mikemartinez99
    - https://www.linkedin.com/in/michael-martinez99

# ─── Kramdown (Markdown renderer) ──────────────────────────────
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# ─── Collections ───────────────────────────────────────────────
collections:
  tabs:
    output: true
    sort_by: order

# ─── Defaults ──────────────────────────────────────────────────
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /posts/:title/
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# ─── Build ─────────────────────────────────────────────────────
sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"
  - Drafts
