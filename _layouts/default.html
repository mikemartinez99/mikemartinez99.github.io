<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title and page.layout != 'home' %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom Styles -->
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body>

  <!-- Animated background -->
  <div class="bg-mesh" aria-hidden="true"></div>

  <!-- Navbar -->
  <nav class="navbar" id="navbar" role="navigation" aria-label="Main navigation">
    <a href="/" class="navbar__brand">MM<span style="color:var(--violet)">.</span></a>
    <ul class="navbar__links">
      <li><a href="/#about">About</a></li>
      <li><a href="/#experience">Experience</a></li>
      <li><a href="/#projects">Projects</a></li>
      <li><a href="/blog/" class="navbar__cta">Blog</a></li>
    </ul>
  </nav>

  <!-- Page content -->
  <div class="page-wrapper">
    {{ content }}
  </div>

  <!-- Footer -->
  <footer>
    <div class="container">
      <ul class="footer__links">
        <li>
          <a href="https://github.com/mikemartinez99" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-github" aria-hidden="true"></i> GitHub
          </a>
        </li>
        <li>
          <a href="https://www.linkedin.com/in/michael-martinez99" target="_blank" rel="noopener noreferrer">
            <i class="fab fa-linkedin" aria-hidden="true"></i> LinkedIn
          </a>
        </li>
        <li>
          <a href="mailto:michael.j.martinez@dartmouth.edu">
            <i class="fas fa-envelope" aria-hidden="true"></i> Email
          </a>
        </li>
      </ul>
      <p class="footer__copy">
        © {{ 'now' | date: '%Y' }} Mike Martinez · Built with Jekyll · Hosted on GitHub Pages
      </p>
    </div>
  </footer>

  <script>
    // Navbar scroll effect
    const nav = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('navbar--scrolled', window.scrollY > 40);
    }, { passive: true });
  </script>

</body>
</html>
